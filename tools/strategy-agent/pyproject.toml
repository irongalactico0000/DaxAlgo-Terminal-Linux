[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "daxalgo-strategy-agent"
version = "0.1.0"
description = "DaxAlgo coordinator for pinned VibeQuant/AKQuant and Point72 CSP strategy runs"
requires-python = ">=3.12,<3.13"
dependencies = [
  "aiohttp==3.14.3",
  "fastapi==0.116.1",
  "litellm==1.95.0",
  "mcp==1.26.0",
  "pydantic==2.11.7",
  "tree-sitter==0.26.0",
  "tree-sitter-bash==0.25.1",
  "uvicorn==0.35.0",
  "websockets==17.0.1",
]

[project.optional-dependencies]
test = [
  "httpx==0.28.1",
  "pytest==8.4.1",
  "pytest-asyncio==1.1.0",
]

[project.scripts]
daxalgo-strategy-agent = "daxalgo_strategy_agent.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["daxalgo_strategy_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
